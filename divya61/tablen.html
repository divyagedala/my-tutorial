<!DOCTYPE html>
<html>
<head>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mk-5">
<div class = "text-center mb-3">
<button class="btn btn-primary" onclick="test()" >Create Table</button>
</div>
<!--<input type="button" value="Create Table" onclick="test()">-->
<div id="op"></div>

<script>
function test(){

    const arr = [
	{ name: "Radha", lang: "English"},
        { name: "Divya", lang: "English" },
        { name: "Yasodha", lang: "Telugu" },
        { name: "Siri", lang: "English" }
    ];

    let output = "<table border='1' cellpadding='10' cellspacing='0'>";


    output += "<tr><th>Name</th><th>Language</th></tr>";


    for(let i = 0; i < arr.length; i++){
        output += "<tr>";
        output += "<td>" + arr[i].name + "</td>";
        output += "<td>" + arr[i].lang + "</td>";
        output += "</tr>";
    }

    output += "</table>";

    document.getElementById("op").innerHTML = output;
}
</script>

</body>
</html>
