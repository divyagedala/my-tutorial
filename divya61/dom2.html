<!DOCTYPE html>
<html>
<head>
<title>DOM Manipulation Example</title>

<style>
    body {
        font-family: Arial;
        text-align: center;
        margin-top: 30px;
    }

    ul {
        list-style-type: none;
        padding: 0;
    }

    li {
        background: lightgray;
        margin: 5px auto;
        padding: 10px;
        width: 200px;
        border-radius: 5px;
        transition: 0.3s;
    }

   
    .highlight {
        background: orange;
        color: white;
        transform: scale(1.05);
    }

   
    .titleColor {
        color: red;
    }

    button {
        margin: 10px;
        padding: 10px 15px;
        cursor: pointer;
    }
</style>
</head>
<body>

<h1 id="mainTitle">DOM Item Manager</h1>

<ul id="itemList">
    <li>Item 1</li>
    <li>Item 2</li>
</ul>


<button onclick="changeStyle()">Change Style & Color</button>
<button onclick="addItem()">Add Item</button>
<button onclick="removeItem()">Remove Last Item</button>

<script>
let count = 2;

function changeStyle() {
    let items = document.getElementsByTagName("li");

    
    for (let i = 0; i < items.length; i++) {
        items[i].classList.toggle("highlight");
    }

   
    let title = document.getElementById("mainTitle");
    title.classList.toggle("titleColor");
}
function addItem() {
    count++;
    let li = document.createElement("li");
    li.textContent = "Item " + count;
    document.getElementById("itemList").appendChild(li);
}

function removeItem() {
    let list = document.getElementById("itemList");

    if (list.children.length > 0) {
        list.removeChild(list.lastElementChild);
        count--;
    }

}
</script>
</body>
</html>
