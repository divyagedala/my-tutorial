<!DOCTYPE html>
<html>
<head>
<title>Operations</title>
</head>
<body>
<h1> Live DOM Playground </h1>

<label for = "textInput" > Enter text: </label><br>
<input type = "text" id = "textInput" placeholder = "Type something..."><br><br>

<label for = "textInput" > Choose text color: </label><br>
<input type = "color" id = "ColorPicker" value = "#000000"><br><br>

<label for = "fontSize">Font Size: </label><br>
<select id = "fontSize">
	<option value="16px">Small</option>
	<option value="24px" selected>Medium</option>
	<option value="32px">Large</option>
	<option value="48px">Extra Large</option>
</select><br><br>

<!-- Added Output -->
<div id="output">Your text will appear here...</div>

<script>
// Get elements
let textInput = document.getElementById("textInput");
let colorPicker = document.getElementById("ColorPicker");
let fontSize = document.getElementById("fontSize");
let output = document.getElementById("output");

// Update function
function updateText() {
    output.innerText = textInput.value;
    output.style.color = colorPicker.value;
    output.style.fontSize = fontSize.value;
}

// Events
textInput.addEventListener("input", updateText);
colorPicker.addEventListener("input", updateText);
fontSize.addEventListener("change", updateText);
</script>

</body>
</html>
