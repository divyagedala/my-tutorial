<!DOCTYPE html>
<html>
<head>
<title>String Operations</title>
</head>
<body>
<div>
	<h1>var Vs let</h1>
	<input type = "button" value = "Test Now" onclick = "test()">
</div>
<div id = "op"> </div>
<script>
	function test(){
		let a=30;
		console.log(a);

		{
			let a =20;
			console.log(a);
			var a =50;  //not allowed

		}
		console.log(a);
	}
</script>
</body>
</html>
