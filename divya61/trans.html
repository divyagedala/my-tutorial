<!DOCTYPE html>
<html>
<head>
 <title>Transition </title>
 <style>
   div {
	width: 200px;
	height: 200px;
	background: red;
	transition: width 3s, height 3s, transform 3s;
}
div:hover {
	width: 1000px;
	transform: rotate(360deg);
}
 </style>
</head>
<body>
<h1>CSS TRANSITION EXAMPLE</h1>
<div></div>
<p>Place the mouse coursor over the object to see</p>
</body>
</html>
