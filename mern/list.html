<h1>Lists</h1>

<h3>Ordered List</h3>
<ol type="i">
<li>One</li>
<li>Two</li>
<li>Three</li>
</ol>

<h3>Unordered List</h3>
<ul type="square">
<li>One</li>
<li>Two</li>
<li>Three</li>
</ul>

<ul type = "none">
<li>👉 one</li>
<li>👉 two</li>
<li>👉 three</li>
</ul>
