<!DOCTYPE html>
<html>
<head>
<title>Registration Form</title>
<link rel="stylesheet" href="trail.css">
</head>

<body>

<div class="nav">
    <a href="index.html">Home</a>
</div>

<h1>Registration Form</h1>

<form action="https://student.ccc.training">
<table border="1">

<tr>
<td>Username</td>
<td><input type="text" name="username"></td>
</tr>

<tr>
<td>Password</td>
<td><input type="password" name="password"></td>
</tr>

<tr>
<td>Email</td>
<td><input type="email" name="email"></td>
</tr>

<tr>
<td>Phone</td>
<td><input type="tel" name="phone"></td>
</tr>

<tr>
<td>Address</td>
<td><textarea name="address"></textarea></td>
</tr>

<tr>
<td>Gender</td>
<td>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
</td>
</tr>

<tr>
<td>Course</td>
<td>
<input type="checkbox"> HTML
<input type="checkbox"> C
<input type="checkbox"> DBMS
<input type="checkbox"> Java
</td>
</tr>

<tr>
<td>Branch</td>
<td>
<select name="branch">
<option>--Select--</option>
<option>CSE</option>
<option>ECE</option>
<option>EEE</option>
</select>
</td>
</tr>

<tr>
<td>Skills</td>
<td>
C <input type="range" min="0" max="100"><br>
Java <input type="range" min="0" max="100"><br>
SQL <input type="range" min="0" max="100">
</td>
</tr>

<tr>
<td>Date</td>
<td><input type="date"></td>
</tr>

<tr>
<td colspan="2" align="center">
<input type="submit" value="Submit">
</td>
</tr>

</table>
</form>

</body>
</html>
